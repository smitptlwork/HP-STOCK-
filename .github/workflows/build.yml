name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'   # >=22.12.0 required by some deps
          cache: 'npm'

      - name: Install dependencies
        # Use npm ci for reproducible builds. If you do not have package-lock.json in the repo, use `npm install` instead.
        run: npm ci

      - name: Build dist
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/**/*.exe
